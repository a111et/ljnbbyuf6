{{ define "main" }}
<div class="container">
  <header class="site-header">
    <h1 class="site-title"><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
    {{ with .Title }}<h2 class="section-title">{{ . }}</h2>{{ end }}
  </header>

  <main>
    <ul class="post-list">
      {{ range .Pages }}
      <li class="post-item">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 января 2006" }}</time>
        <a href="{{ .Permalink }}">{{ .Title }}</a>
      </li>
      {{ end }}
    </ul>
  </main>

  <footer class="site-footer">
    <a href="{{ .Site.BaseURL }}" class="back-link">← Главная</a>
  </footer>
</div>
{{ end }}
