{{ define "main" }}
<article class="container">
  <header class="article-header">
    <h1 class="article-title">{{ .Title }}</h1>
    <div class="article-meta">
      {{ with .Params.author }}<span class="article-author">{{ . }}</span>{{ end }}
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 января 2006" }}</time>
    </div>
  </header>

  <div class="article-content">
    {{ .Content }}
  </div>

  <footer class="article-footer">
    <a href="{{ .Site.BaseURL }}" class="back-link">← Все записи</a>
  </footer>
</article>
{{ end }}
