baseURL = "https://a111et.github.io/ljnbbyuf6/"
languageCode = "ru"
defaultContentLanguage = "ru"
title = "Мой блог"
enableEmoji = true

# Чистые URL без .html
[permalinks]
  posts = "/posts/:slug/"

# RSS
[outputs]
  home = ["HTML", "RSS"]

[params]
  description = "Минималистичный блог о технологиях и мыслях"
  author = "a111et"

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = "dracula"
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
